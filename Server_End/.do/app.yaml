# DigitalOcean App Platform spec (plan-level: NOT yet deployed or validated against the console).
name: trustlens-api
region: blr
services:
  - name: api
    github:
      repo: Aryan-en/Rein-Hacktoberfest-2026
      branch: main
      deploy_on_push: true
    source_dir: Server_End
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    health_check:
      http_path: /api/health
    instance_count: 1   # the in-memory rate limiter assumes a single instance
    envs:
      - { key: DO_GENAI_API_KEY, scope: RUN_TIME, type: SECRET }
      - { key: DO_GENAI_BASE_URL, scope: RUN_TIME, value: "https://inference.do-ai.run/v1" }
      - { key: TRUSTLENS_PRIMARY_MODEL, scope: RUN_TIME, value: "meta-llama/llama-3.3-70b-instruct" }
      - { key: TRUSTLENS_FALLBACK_MODEL, scope: RUN_TIME, value: "meta-llama/llama-3.1-8b-instruct" }
      - { key: TRUSTLENS_CORS_ORIGINS, scope: RUN_TIME, value: "https://REPLACE-WITH-FRONTEND-ORIGIN" }
      - { key: TRUSTLENS_PROXY_HOPS, scope: RUN_TIME, value: "1" }
      - { key: PORT, scope: RUN_TIME, value: "8080" }
