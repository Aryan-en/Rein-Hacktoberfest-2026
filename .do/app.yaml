# DigitalOcean App Platform Specification for TrustLens AI
# Monorepo deployment: Next.js Frontend (web) + Node.js API Service (api)
name: trustlens-ai
region: blr

services:
  # 1. Next.js Frontend Service
  - name: web
    github:
      repo: Aryan-en/Rein-Hacktoberfest-2026
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    routes:
      - path: /
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: "production"

  # 2. Standalone Backend Investigation API Service
  - name: api
    github:
      repo: Aryan-en/Rein-Hacktoberfest-2026
      branch: main
      deploy_on_push: true
    source_dir: Server_End
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    routes:
      - path: /api
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DO_GENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DO_GENAI_BASE_URL
        scope: RUN_TIME
        value: "https://inference.do-ai.run/v1"
      - key: TRUSTLENS_PRIMARY_MODEL
        scope: RUN_TIME
        value: "meta-llama/llama-3.3-70b-instruct"
      - key: TRUSTLENS_FALLBACK_MODEL
        scope: RUN_TIME
        value: "meta-llama/llama-3.1-8b-instruct"
      - key: TRUSTLENS_PROXY_HOPS
        scope: RUN_TIME
        value: "1"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
